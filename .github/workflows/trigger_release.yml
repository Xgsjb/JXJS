name: Build Application and Make Release

on:
  push:
    tags: [ "*" ]

permissions:
  contents: write

jobs:
  source:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pack
        run: ./.ci/source.sh
      - name: Upload
        uses: forgejo/upload-artifact@v4
        with:
          name: source.zip
          path: artifacts/

  windows:
    runs-on: windows
    strategy:
      matrix:
        target: ["msvc"] # TODO: Add msys2
    defaults:
      run:
        shell: ${{ (matrix.target == 'msys2' && 'msys2') || 'bash' }} {0}
    env:
      CCACHE_DIR: ${{ runner.workspace }}/.cache/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: windows
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
            ${{ github.workspace }}/build/externals
            ${{ github.workspace }}/.vcpkg
          key: ${{ runner.os }}-${{ matrix.target }}-vcpkg-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-vcpkg-

      - name: Set up MSVC
        uses: https://github.com/ilammy/msvc-dev-cmd@v1
        if: ${{ matrix.target == 'msvc' }}

      - name: Cygwin with autoconf # NEEDED FOR LIBUSB
        shell: cmd
        run: ./.ci/windows/cygwin.bat

      - name: Configure & Build
        id: cmake
        shell: cmd
        run: ./.ci/windows/build-bqt.bat amd64 no

      - name: Package artifacts
        shell: powershell
        run: ./.ci/windows/package.ps1 amd64 no

      - name: Upload Windows artifacts
        uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.zip
          path: artifacts/*

  linux:
    runs-on: linux
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: fresh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Build
        run: TARGET=appimage ./.ci/linux/build.sh v3 8

      - name: Package AppImage
        run: ./.ci/linux/package.sh v3 &> /dev/null

      - name: Upload Linux artifacts
        uses: forgejo/upload-artifact@v4
        with:
          name: linux.zip
          path: ./*.AppImage*

  android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android == 'true' || github.event_name == 'push' }}
    env:
      CCACHE_DIR: ${{ runner.workspace }}/.cache/ccache
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-tags: true

      - name: Cache setup
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ${{ env.ANDROID_HOME }}
            ${{ env.CCACHE_DIR }}
          key: android-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}

      - name: Versioning
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "VERSION=nightly-$(date +%Y%m%d)" >> $GITHUB_ENV
          fi

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Build APK/AAB
        run: ./.ci/android/build.sh

      - name: Package artifacts
        run: ./.ci/android/package.sh

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION }}
          path: |
            artifacts/*.apk
            artifacts/*.aab
          retention-days: 7

  create_release:
    needs: 
      - linux
      - windows
      - android
    if: ${{ github.event_name == 'push' }}  # 仅标签推送时创建Release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p dist
          find artifacts -name '*.AppImage*' -exec cp {} dist \;
          find artifacts -name 'msvc.zip' -exec unzip -j {} '*.zip' -d dist \;
          cp artifacts/android-*/{*.apk,*.aab} dist/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create_release.outputs.tag }}
          files: |
            dist/*.AppImage
            dist/*.zip
            dist/*.apk
            dist/*.aab
```
